<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>本社部対抗フットサルリーグ</title>
<meta name="theme-color" content="#0f381e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="brand" id="headerBrand">
      <span class="ball-dot"></span>
      <span>フットサルリーグ</span>
    </div>
    <button class="icon-btn" id="settingsBtn" data-action="openAdminMenu" aria-label="管理者メニュー" title="管理者メニュー">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="settingsBtnIcon">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <!-- 画面描画エリア（app.js が差し替える） -->
  <main id="screenRoot"></main>

  <!-- ボトムナビゲーション（一般画面用） -->
  <nav class="tabbar" id="tabbar">
    <button class="tabbar-item" data-action="navigateRoute" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      <span>ホーム</span>
    </button>
    <button class="tabbar-item" data-action="navigateRoute" data-route="schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span>対戦表</span>
    </button>
    <button class="tabbar-item" data-action="navigateRoute" data-route="ranking">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V10M14 21V4M20 21v-7M2 21h20"></path></svg>
      <span>順位</span>
    </button>
    <button class="tabbar-item" data-action="navigateRoute" data-route="archive">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 13h4"></path></svg>
      <span>アーカイブ</span>
    </button>
  </nav>

  <!-- トースト通知 -->
  <div class="toast" id="toast"></div>

  <!-- ローディングオーバーレイ（サッカーボールが跳ねるアニメーション） -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="soccer-bounce">
      <svg class="soccer-ball" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="47" fill="#f5f5f5" stroke="#141414" stroke-width="3"/>
        <polygon points="50,37 62.4,46 57.6,60.5 42.4,60.5 37.6,46" fill="#141414"/>
        <g transform="translate(67.6,25.7) rotate(-54)"><polygon points="0,-9 8.6,-2.8 5.3,7.3 -5.3,7.3 -8.6,-2.8" fill="#141414"/></g>
        <g transform="translate(78.5,59.3) rotate(18)"><polygon points="0,-9 8.6,-2.8 5.3,7.3 -5.3,7.3 -8.6,-2.8" fill="#141414"/></g>
        <g transform="translate(50,80) rotate(90)"><polygon points="0,-9 8.6,-2.8 5.3,7.3 -5.3,7.3 -8.6,-2.8" fill="#141414"/></g>
        <g transform="translate(21.5,59.3) rotate(162)"><polygon points="0,-9 8.6,-2.8 5.3,7.3 -5.3,7.3 -8.6,-2.8" fill="#141414"/></g>
        <g transform="translate(32.4,25.7) rotate(234)"><polygon points="0,-9 8.6,-2.8 5.3,7.3 -5.3,7.3 -8.6,-2.8" fill="#141414"/></g>
      </svg>
      <div class="soccer-shadow"></div>
    </div>
    <div class="loading-label">通信中…（最大<span id="loadingMaxSec">15</span>秒）</div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
