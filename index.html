<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フットサルリーグ 管理・観戦ポータル</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ローディングスピナー -->
    <div id="loading-spinner">
        <div>読み込み中...</div>
    </div>

    <!-- ヘッダー -->
    <header>
        <h1>フットサルリーグ ポータル</h1>
        <div id="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('schedule', event)">試合・スケジュール</button>
            <button class="tab-btn" onclick="switchTab('rankings', event)">ランキング</button>
            <button class="tab-btn" onclick="switchTab('admin', event)">管理者メニュー</button>
        </div>
    </header>

    <main class="container">
        <!-- 1. スケジュール・試合結果タブ -->
        <section id="tab-schedule" class="tab-content active">
            <div class="filter-box">
                <label for="tournament-select">大会選択:</label>
                <select id="tournament-select" onchange="onTournamentChange()">
                    <option value="">大会データを読み込み中...</option>
                </select>
            </div>
            <h2>対戦・スコア一覧</h2>
            <div id="schedule-container">
                <!-- 動的レンダリング -->
            </div>
        </section>

        <!-- 2. ランキングタブ -->
        <section id="tab-rankings" class="tab-content">
            <h2>チーム順位表 (勝率優先)</h2>
            <div class="table-responsive">
                <table id="team-ranking-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>チーム名</th>
                            <th>試合</th>
                            <th>勝</th>
                            <th>分</th>
                            <th>敗</th>
                            <th>得失</th>
                            <th>勝点</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="team-ranking-empty"
                style="display:none; color:var(--text-muted); text-align:center; padding: 20px;">チームランキングデータがありません。
            </div>

            <h2 style="margin-top: 30px;">個人得点ランキング</h2>
            <div class="table-responsive">
                <table id="player-ranking-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>氏名</th>
                            <th>所属部署</th>
                            <th>得点</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="player-ranking-empty"
                style="display:none; color:var(--text-muted); text-align:center; padding: 20px;">個人得点ランキングデータがありません。
            </div>
        </section>

        <!-- 3. 管理者メニュータブ -->
        <section id="tab-admin" class="tab-content">
            <div id="admin-login-wrapper" class="card">
                <h3>管理者ログイン</h3>
                <p>大会作成、チーム登録、対戦表自動生成、スコア入力を行うにはログインしてください。</p>
                <input type="password" id="admin-password-input" placeholder="管理者パスワード" />
                <button onclick="handleAdminLogin()" style="margin-top: 10px; width: 100%;">ログイン</button>
            </div>

            <div id="admin-dashboard-wrapper" style="display: none;">
                <!-- ダッシュボードヘッダー -->
                <div class="card"
                    style="border-color: var(--accent-color); display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h3>管理者ダッシュボード</h3>
                        <p style="color: var(--accent-color); font-weight: bold; margin: 0;">認証済みセッション有効</p>
                    </div>
                    <button onclick="handleAdminLogout()"
                        style="background-color: var(--danger-color); color: #fff;">ログアウト</button>
                </div>

                <!-- 大会作成カード -->
                <div class="card">
                    <h3>1. 大会新規作成</h3>
                    <div style="margin-bottom: 10px;">
                        <label>大会名:</label>
                        <input type="text" id="new-tournament-name" placeholder="例: 2026年度 第2回大会" />
                    </div>
                    <button onclick="handleCreateTournament()"
                        style="background-color: var(--accent-yellow); width: 100%;">大会を作成する（ID自動採番）</button>
                </div>

                <!-- チーム登録カード -->
                <div class="card">
                    <h3>2. チーム登録</h3>
                    <div style="margin-bottom: 10px;">
                        <label>対象大会:</label>
                        <select id="admin-tournament-select"></select>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label>チーム名:</label>
                        <input type="text" id="new-team-name" placeholder="例: FC プレイヤーズ" />
                    </div>
                    <button onclick="handleRegisterTeam()"
                        style="background-color: var(--accent-yellow); width: 100%;">チームを登録する（ID自動採番）</button>
                </div>

                <!-- 対戦表自動生成カード -->
                <div class="card">
                    <h3>3. 対戦スケジュール自動生成</h3>
                    <p style="font-size: 0.9rem; color: var(--text-muted);">登録されたチーム同士の総当たり対戦カードを自動作成します。</p>
                    <button onclick="handleGenerateSchedule()"
                        style="background-color: var(--accent-color); width: 100%;">対戦表を自動生成する</button>
                </div>
            </div>
        </section>
    </main>

    <!-- スコア入力モーダル -->
    <div id="score-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeScoreModal()">&times;</span>
            <h3 id="modal-match-title">試合結果入力</h3>
            <div id="modal-team-inputs">
                <!-- 動的生成 -->
            </div>
            <button onclick="submitModalScore()" style="width: 100%; margin-top: 20px;">保存する（後勝ち上書き）</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
