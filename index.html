<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フットサルリーグ 管理・観戦ポータル</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ローディングスピナー -->
    <div id="loading-spinner">
        <div>読み込み中...</div>
    </div>

    <!-- ヘッダー -->
    <header>
        <h1>フットサルリーグ ポータル</h1>
        <div id="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('schedule', event)">試合・スケジュール</button>
            <button class="tab-btn" onclick="switchTab('rankings', event)">ランキング</button>
            <button class="tab-btn" onclick="switchTab('admin', event)">管理者メニュー</button>
        </div>
    </header>

    <main class="container">
        <!-- 1. スケジュール・試合結果タブ -->
        <section id="tab-schedule" class="tab-content active">
            <div class="filter-box">
                <label for="tournament-select">大会選択:</label>
                <select id="tournament-select" onchange="onTournamentChange()">
                    <option value="TN_2026_01">2026年度 第1回大会</option>
                </select>
            </div>
            <h2>対戦・スコア一覧</h2>
            <div id="schedule-container">
                <!-- 動的レンダリング -->
            </div>
        </section>

        <!-- 2. ランキングタブ -->
        <section id="tab-rankings" class="tab-content">
            <h2>チーム順位表 (勝率優先)</h2>
            <div class="table-responsive">
                <table id="team-ranking-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>チーム名</th>
                            <th>試合</th>
                            <th>勝</th>
                            <th>分</th>
                            <th>敗</th>
                            <th>得失</th>
                            <th>勝点</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <h2 style="margin-top: 30px;">個人得点ランキング</h2>
            <div class="table-responsive">
                <table id="player-ranking-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>氏名</th>
                            <th>所属部署</th>
                            <th>得点</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- 3. 管理者メニュータブ -->
        <section id="tab-admin" class="tab-content">
            <div id="admin-login-wrapper" class="card">
                <h3>管理者ログイン</h3>
                <p>スコアの確定や対戦表の自動生成を行うにはログインしてください。</p>
                <input type="password" id="admin-password-input" placeholder="管理者パスワード" />
                <button onclick="handleAdminLogin()" style="margin-top: 10px; width: 100%;">ログイン</button>
            </div>

            <div id="admin-dashboard-wrapper" style="display: none;">
                <div class="card" style="border-color: var(--accent-color);">
                    <h3>管理者ダッシュボード</h3>
                    <p style="color: var(--accent-color); font-weight: bold;">認証済みセッション有効</p>
                    <button onclick="handleGenerateSchedule()"
                        style="background-color: var(--accent-yellow); margin-top: 10px;">対戦表を自動生成する</button>
                    <button onclick="handleAdminLogout()"
                        style="background-color: var(--danger-color); color: #fff; margin-top: 10px; margin-left: 10px;">ログアウト</button>
                </div>
            </div>
        </section>
    </main>

    <!-- スコア入力モーダル -->
    <div id="score-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeScoreModal()">&times;</span>
            <h3 id="modal-match-title">試合結果入力</h3>
            <div id="modal-team-inputs">
                <!-- 動的生成 -->
            </div>
            <button onclick="submitModalScore()" style="width: 100%; margin-top: 20px;">保存する（後勝ち上書き）</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
