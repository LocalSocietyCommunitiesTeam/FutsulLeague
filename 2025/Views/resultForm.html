<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>試合結果入力</title>
    <link rel="stylesheet" href="../futsul_files/p_css/reset.css" />
    <link rel="stylesheet" href="../futsul_files/p_css/component.css" />
    <link rel="stylesheet" href="../futsul_files/p_css/common.css" />
    <link rel="stylesheet" href="../futsul_files/p_css/matchResult.css" />
    <link rel="stylesheet" href="../futsul_files/p_css/resultForm.css" />
</head>

<body class="com_body_flex">
    <!-- ヘッダー -->
    <header class="com_header">
        <button id="back-to-list" class="back-btn">←</button>
        <p class="c_typo_headerL c_typo_WHT"><span id="match-round" class="badge round">第1節</span></p>
        <h2 class="c_typo_headerM c_typo_WHT">試合結果入力</h2>
    </header>

    <!-- メイン -->
    <main class="com_main">
        <div class="form-container">
            <div class="card">
                <label>試合日時</label>
                <div class="datetime">
                    <span id="match-datetime-display"
                        style="flex:1;padding:0.8rem;border:1px solid #ddd;border-radius:0.6rem;width:100%;text-align:center;background-color:#eee;color:#333;">--/--
                        --:-- ~ --:--</span>
                </div>
            </div>

            <div class="card">
                <div class="card-header flex-between" style="margin-bottom:8px;">
                    <label style="margin:0;">対戦情報</label>
                </div>

                <div id="team2-select" style="margin-top:8px;">
                    <div style="display:flex;gap:8px;align-items:center;justify-content:center;">
                        <span id="team1-name" style="font-weight:bold;color:#14788b;font-size:14px;">--</span>
                        <span style="color:#666">vs</span>
                        <span id="team2-name" style="font-weight:bold;color:#14788b;font-size:14px;">--</span>
                    </div>
                </div>

                <div class="score-display" style="margin-top:8px;">
                    <div>
                        <div class="team-label" id="team1-label"></div>
                        <div><span id="team1-score" class="score">0</span></div>
                    </div>
                    <span class="vs">-</span>
                    <div>
                        <div class="team-label" id="team2-label"></div>
                        <div><span id="team2-score" class="score">0</span></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <label>会場</label>
                <p id="venue-display"
                    style="padding: 0.8rem; border: 1px solid #ddd; border-radius: 0.6rem; background-color: #eee;">
                    会場名
                </p>
                <input type="hidden" id="venue-input" />
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 style="margin:0;">得点者</h3>
                </div>

                <div class="goal-section">
                    <h4 id="team1-goal-title"></h4>
                    <div id="team1-goals"></div>
                    <button class="add-btn" data-team="1" type="button">＋ 得点者追加</button>

                    <h4 id="team2-goal-title" style="margin-top:12px;"></h4>
                    <div id="team2-goals"></div>
                    <button class="add-btn" data-team="2" type="button">＋ 得点者追加</button>
                </div>
            </div>

            <input type="hidden" id="round-select" value="" />
        </div>
    </main>

    <nav class="rf_nav">
        <ul class="rf_navList">
            <li><a id="cancel-entry" class="rf_navBtn rf_navBtn_WHT" href="javascript:void(0);">
                    <p class="c_typo_headerM c_typo_center c_typo_GRN04">キャンセル</p>
                </a></li>
            <li><a id="save-entry" class="rf_navBtn rf_navBtn_GRN" href="javascript:void(0);">
                    <p class="c_typo_headerM c_typo_center c_typo_WHT">保存</p>
                </a></li>
        </ul>
    </nav>

    <script src="../futsul_files/p_css/event.js"></script>
    <script src="../futsul_files/p_css/common.js"></script>
    <script src="../futsul_files/p_css/matchResult.js"></script>
    <script src="../futsul_files/p_css/resultForm.js"></script>
</body>

</html>
