<!DOCTYPE html>

<head>

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../futsul_files/p_css/reset.css?20251010">
    <style>
        .com_body {

            flex-direction: column;
            height: 100vh;
            background-image: url("../futsul_files/p_image/futsul_court.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .com_header {
            padding: 16px 0;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .com_main {
            flex-grow: 1;

        }

        .com_footer {
            padding: 16px 0;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .c_typo_headerXL {
            font-size: 24px;
            line-height: 36px;
            font-weight: 700;
        }

        .c_typo_headerL {
            font-size: 18px;
            line-height: 26px;
            font-weight: 700;
        }

        .c_typo_headerM {
            font-size: 16px;
            line-height: 24px;
            font-weight: 700;
        }

        .c_typo_headerS {
            font-size: 14px;
            line-height: 20px;
            font-weight: 700;
        }

        .c_typo_WHT {
            color: #2E2E2E;
        }

        .c_typo_center {
            text-align: center;
        }

        .hm_btnSec {
            padding: 48px 20px;
        }

        .hm_btnList>li:not(:first-child) {
            padding-top: 24px;
        }

        .hm_btn {
            display: block;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            padding: 24px;
        }

<body class="com_body">
    <header class="com_header">
        <h1 class="c_typo_headerXL c_typo_WHT c_typo_center">ホーム2</h1>

        <section class="hm_btnSec">

</html>
