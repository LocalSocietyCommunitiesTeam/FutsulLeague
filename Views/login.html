<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>フットサルリーグ｜管理者ログイン</title>
    <link rel="stylesheet" href="../common/css/reset.css">
    <link rel="stylesheet" href="../common/css/components.css">
    <link rel="stylesheet" href="../futsul_files/css/common.css">
    <link rel="stylesheet" href="../futsul_files/css/login.css">
</head>

<body class="com_body">
    <!-- ヘッダー -->
    <header class="com_header">
        <a href="javascript: history.back();" class="c_typo_headerM c_typo_WHT">←</a>
        <h1 class="c_typo_headerM c_typo_WHT">&nbsp;管理者ログイン</h1>
    </header>

    <!-- メイン -->
    <main class="com_main">
        <section class="lo_loginSec">
            <div class="lo_card">
                <div class="lo_img">
                    <p class="c_typo_numberL c_typo_BLK10 c_typo_align_center">⚽️</p>
                </div>
                <div class="lo_title">
                    <p class="c_typo_headerL c_typo_BLK10 c_typo_align_center">管理者ログイン</p>
                </div>
                <div class="lo_exp">
                    <p class="c_typo_bodyS c_typo_BLK8 c_typo_align_center">パスワードを入力してください</p>
                </div>
                <div class="lo_pwArea">
                    <p class="c_typo_headerXS c_typo_BLK10 c_typo_align_left">パスワード</p>
                    <div class="lo_pwInputArea">
                        <div class="c_textField01">
                            <div class="c_textField01_inputForm"><input id="lo_password" class="c_textField01_inputText"
                                    placeholder="パスワードを入力" type="password" autocomplete="on" required /></div>
                        </div>
                    </div>
                </div>
                <div class="lo_loginBtnArea">
                    <div class="c_button01 c_button01_green" ontouchstart=""><a href="javascript:void(0);"
                            id="lo_loginBtn">
                            <div class="c_button01_wrapper c_button01_icon_not">
                                <p class="c_typo_cta c_typo_WHT c_typo_align_center">ログイン</p>
                            </div>
                        </a></div>
                </div>
            </div>
        </section>
    </main>

    <script src="../common/js/event.js"></script>
    <script src="../futsul_files/js/common.js"></script>
    <script src="../futsul_files/js/login.js"></script>
</body>


</html>
