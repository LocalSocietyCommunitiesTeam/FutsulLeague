<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1A1A1A">
    <title>フットサルリーグ|試合詳細・編集</title>
    <link rel="stylesheet" href="../common/css/reset.css">
    <link rel="stylesheet" href="../common/css/components.css">
    <link rel="stylesheet" href="../futsul_files/css/common.css">
    <link rel="stylesheet" href="../futsul_files/css/matchDetail.css">
</head>

<body class="com_body">
    <div id="com_loader" class="com_loader"></div>

    <header class="com_header">
        <a href="javascript: history.back();" class="c_typo_headerM c_typo_WHT">←</a>
        <h1 class="c_typo_headerM c_typo_WHT">&nbsp;試合詳細</h1>
    </header>

    <main class="com_main">
        <div id="mdt_viewMode">
            <section class="mdt_cardSec">
                <div class="mdt_card">
                    <div class="mdt_card_head">
                        <p class="c_typo_headerXS c_typo_BLK10"><span id="mdt_court">-</span></p>
                        <div class="c_tag01">
                            <div id="mdt_status_tag" class="c_tag01_wrap c_tag01_h24 c_tag01_neutral">
                                <p id="mdt_status" class="c_typo_headerXXS c_typo_BLK01">-</p>
                            </div>
                        </div>
                    </div>

                    <div class="mdt_card_main">
                        <div class="mdt_team_side">
                            <p id="mdt_teamA" class="c_typo_headerS c_typo_BLK01 c_typo_align_center">-</p>
                        </div>
                        <div class="mdt_score_side">
                            <p id="mdt_scoreA" class="c_typo_headerXL c_typo_GRN10 c_typo_align_center">-</p>
                            <p class="c_typo_bodyM c_typo_BLK01">VS</p>
                            <p id="mdt_scoreB" class="c_typo_headerXL c_typo_GRN10 c_typo_align_center">-</p>
                        </div>
                        <div class="mdt_team_side">
                            <p id="mdt_teamB" class="c_typo_headerS c_typo_BLK01 c_typo_align_center">-</p>
                        </div>
                    </div>

                    <div class="mdt_card_foot">
                        <p class="c_typo_bodyS c_typo_BLK8 c_typo_align_center">
                            <span id="mdt_matchNum">-</span> &nbsp; <span id="mdt_time">-</span>
                        </p>
                    </div>
                </div>
            </section>

            <section class="mdt_scorerSec">
                <div class="mdt_scorerGrid">
                    <div class="mdt_scorerBox">
                        <h3 class="c_typo_headerXXS c_typo_BLK08">得点者</h3>
                        <p id="mdt_scorersA" class="c_typo_bodyM c_typo_BLK10 mdt_scorerList">なし</p>
                    </div>
                    <div class="mdt_scorerBox mdt_align_right">
                        <h3 class="c_typo_headerXXS c_typo_BLK08">得点者</h3>
                        <p id="mdt_scorersB" class="c_typo_bodyM c_typo_BLK10 mdt_scorerList">なし</p>
                    </div>
                </div>
            </section>

            <section class="mdt_btnSec">
                <div id="mdt_toEditBtn" class="c_button01 c_button01_green" ontouchstart=""><a
                        href="javascript: void(0);">
                        <div class="c_button01_wrapper c_button01_icon_not">
                            <p class="c_typo_cta c_typo_WHT c_typo_align_center">結果編集</p>
                        </div>
                    </a></div>
            </section>
        </div>

        <div id="mdt_editMode" style="display: none;">
            <section class="mdt_formSec">
                <form id="mdt_editForm">
                    <div class="mdt_formCard">
                        <h2 class="c_typo_headerS c_typo_BLK10 mdt_formTitle">試合結果の入力</h2>

                        <div class="mdt_formRow">
                            <div class="mdt_inputGroup">
                                <label id="mdt_labelTeamA" class="c_typo_headerXXS c_typo_BLK08">ホームチーム</label>
                                <input type="number" id="mdt_inputScoreA" class="mdt_scoreInput" min="0" required>
                            </div>
                            <p class="c_typo_headerM c_typo_BLK04 mdt_formVs">ー</p>
                            <div class="mdt_inputGroup">
                                <label id="mdt_labelTeamB" class="c_typo_headerXXS c_typo_BLK08">アウェイチーム</label>
                                <input type="number" id="mdt_inputScoreB" class="mdt_scoreInput" min="0" required>
                            </div>
                        </div>

                        <div class="mdt_formBlock">
                            <label class="c_typo_headerXXS c_typo_BLK08">得点者の入力対象チーム</label>
                            <select id="mdt_selectTargetSide" class="mdt_targetSideSelect">
                                <option value="A" selected>ホームチーム（左）</option>
                                <option value="B">アウェイチーム（右）</option>
                            </select>
                        </div>

                        <div class="mdt_formBlock">
                            <div class="mdt_blockHeader">
                                <label class="c_typo_headerXXS c_typo_BLK08"><span id="mdt_targetTeamName">-</span>
                                    の得点者</label>
                                <button type="button" id="mdt_addScorerBtn"
                                    class="c_tag01_wrap c_tag01_h24 c_tag01_neutral mdt_ogBtn">＋ 得点者を追加</button>
                            </div>
                            <div id="mdt_target_scorer_list" class="mdt_dynamicScorersContainer"></div>
                        </div>
                    </div>

                    <div class="mdt_formBtns">
                        <div class="c_button01 c_button01_green" ontouchstart=""><a href="javascript: void(0);"
                                id="mdt_saveBtn">
                                <div class="c_button01_wrapper c_button01_icon_not">
                                    <p class="c_typo_cta c_typo_WHT c_typo_align_center">保存</p>
                                </div>
                            </a></div>
                        <div id="mdt_cancelBtn" class="c_button01 c_button01_white" ontouchstart=""><a
                                href="javascript: void(0);">
                                <div class="c_button01_wrapper c_button01_icon_not">
                                    <p class="c_typo_cta c_typo_GRN10 c_typo_align_center">キャンセル</p>
                                </div>
                            </a></div>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <nav class="com_nav">
        <ul class="com_nav_btnList">
            <li><a href="./home.html">
                    <div class="com_nav_img">🏠</div>
                    <p class="c_typo_bodyXS c_typo_BLK10 c_typo_align_center">ホーム</p>
                </a></li>
            <li><a href="./member.html">
                    <div class="com_nav_img">👥</div>
                    <p class="c_typo_bodyXS c_typo_BLK10 c_typo_align_center">メンバー管理</p>
                </a></li>
            <li><a href="./match.html">
                    <div class="com_nav_img">📋</div>
                    <p class="c_typo_bodyXS c_typo_BLK8 c_typo_align_center">対戦表</p>
                </a></li>
            <li><a href="./ranking.html">
                    <div class="com_nav_img">🏆</div>
                    <p class="c_typo_bodyXS c_typo_BLK10 c_typo_align_center">ランキング</p>
                </a></li>
        </ul>
    </nav>

    <script src="../common/js/event.js"></script>
    <script src="../futsul_files/js/common.js"></script>
    <script src="../futsul_files/js/matchDetail.js"></script>
</body>

</html>
